name: CI

on:
  push:
    branches: [main, baseline/wave10-consolidation]
  pull_request:
    branches: [main, baseline/wave10-consolidation]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: ESLint suppressions baseline check
        run: |
          # Exclude checks-cicd.ts specifically: its docstring documents this check, so counting it
          # makes the gate fail on itself. Modularization split the original checks.ts, and the old
          # `grep -v 'checks.ts'` filter no longer matched the file that now carries that docstring.
          CURRENT=$(grep -r 'eslint-disable' src/ --include='*.ts' --include='*.tsx' | grep -v 'checks-cicd.ts' | wc -l | tr -d ' ')
          BASELINE=$(python3 -c "import json; print(json.load(open('eslint-suppressions.json'))['baseline']['count'])")
          echo "Current: $CURRENT | Baseline: $BASELINE"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "ERROR: ESLint suppressions increased ($CURRENT > $BASELINE)."
            echo "Remove the new eslint-disable comment(s) or document exception with tracked issue URL."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dead code check
        # Keep the full Knip scan and exit behavior; GitHub annotations surface findings when raw logs are unavailable.
        run: npx knip --reporter symbols --reporter github-actions

      - name: Coverage check
        run: npm run test:coverage

  migration-recovery-eval:
    name: Migration + legacy recovery evaluators (isolated local D1)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Both evaluators run against isolated LOCAL Wrangler D1 databases created from scratch
      # (--reset), with strict node:assert assertions and nonzero exit codes on any failure.
      # They use no secrets, no remote D1 and no provider calls.
      - name: Migration 0016 legacy evaluator (isolated local D1)
        run: node scripts/verification/pr35-migration-0016-legacy-eval.mjs --reset

      - name: Legacy entitlement recovery evaluator (isolated local D1)
        run: node scripts/verification/pr35-legacy-recovery-eval.mjs --reset

      - name: Ops approval + durable scheduling evaluator (isolated local D1)
        run: node scripts/verification/pr35-ops-scheduling-eval.mjs --reset

      - name: Upload evaluator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr35-migration-recovery-eval-${{ github.sha }}
          path: docs/verification/artifacts/
          if-no-files-found: error
          retention-days: 14

  worker-browser-e2e:
    name: OpenNext Worker + D1 browser E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run isolated OpenNext Worker and browser regression suite
        run: node scripts/verification/pr35-browser-e2e.mjs

      - name: Upload sanitized browser screenshots, traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr35-browser-e2e-${{ github.sha }}
          path: .wrangler/verification/pr35-browser-artifacts/
          if-no-files-found: error
          retention-days: 14
