name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: ESLint suppression baseline check
        run: |
          CURRENT=$(grep -r "eslint-disable" src/ --include="*.ts" --include="*.tsx" -c 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          BASELINE=$(python3 -c "import json; print(json.load(open('eslint-suppressions.json'))['baseline']['count'])")
          echo "Current: $CURRENT | Baseline: $BASELINE"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "ERROR: ESLint suppressions increased ($CURRENT > $BASELINE)."
            echo "Remove the new eslint-disable comment(s) or document exception with tracked issue URL."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage check
        run: npm run test:coverage
